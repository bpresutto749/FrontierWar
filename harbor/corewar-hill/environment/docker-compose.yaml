services:
  main:
    depends_on:
      arena:
        condition: service_healthy
  arena:
    build:
      context: ./arena
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      RESULTS_DIR: /results
      ARENA_DATA: /srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 60
